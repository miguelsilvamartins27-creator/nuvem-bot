name: Testes

on:
  pull_request:
  push:
    branches:
      - main
      - fix/viral-multi-source

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar sintaxe
        run: npm run check
      - name: Executar testes
        run: npm test
